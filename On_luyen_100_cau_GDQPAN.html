</style></head><body><header><div class="inner"><div style="opacity:.8;font-size:13px">HỘI THI GIÁO VIÊN GIỎI · GDQP&AN</div><h1>Ôn luyện 100 câu nâng cao</h1><div>Học trên điện thoại · Luyện tập và thi thử</div></div></header><main class="wrap"><div id="app"></div><div class="foot">Nội dung và đáp án trích từ tài liệu Word được cung cấp; chưa kiểm chứng độc lập tính cập nhật của các quy định pháp luật.</div></main><script>
const DATA=[{"id": 1, "q": "Theo VBHN 53/VBHN-BQP 2025, cơ quan nào có thẩm quyền quyết định triệu tập cán bộ thuộc Đối tượng 1 (cán bộ thuộc diện Bộ Chính trị, Ban Bí thư quản lý) tham gia bồi dưỡng kiến thức QPAN?", "options": {"A": "Trưởng Ban Tổ chức Trung ương Đảng", "B": "Chủ tịch Hội đồng Giáo dục quốc phòng và an ninh Trung ương", "C": "Bộ trưởng Bộ Quốc phòng", "D": "Thủ tướng Chính phủ"}, "answer": "B", "source": "VBHN 53/VBHN-BQP 2025, Điều 2, Khoản 1", "section": "PHẦN I: LUẬT GDQPAN 2013, VBHN 48 & VBHN 53/VBHN-BQP 2025 (20 CÂU NÂNG CAO)"}, {"id": 2, "q": "Theo quy định tại VBHN 53/VBHN-BQP 2025, cơ sở nào sau đây là đơn vị ĐỦY NHẤT được giao nhiệm vụ bồi dưỡng kiến thức QPAN cho cán bộ thuộc Đối tượng 1?", "options": {"A": "Học viện Chính trị (Bộ Quốc phòng)", "B": "Học viện Lục quân", "C": "Học viện Quốc phòng", "D": "Trường Quân sự các Quân khu"}, "answer": "C", "source": "VBHN 53/VBHN-BQP 2025, Điều 3, Khoản 1", "section": "PHẦN I: LUẬT GDQPAN 2013, VBHN 48 & VBHN 53/VBHN-BQP 2025 (20 CÂU NÂNG CAO)"}, {"id": 3, "q": "Theo VBHN 53/VBHN-BQP 2025, khoản chi phí bồi dưỡng kiến thức QPAN cho người lao động tại doanh nghiệp ngoài công lập được xử lý như thế nào về mặt tài chính?", "options": {"A": "Doanh nghiệp tự chi trả từ quỹ phúc lợi và không được khấu trừ thuế", "B": "Ngân sách nhà nước hỗ trợ 50% chi phí thực tế", "C": "Được tính vào chi phí hợp lý được trừ khi xác định thuế thu nhập doanh nghiệp (TNDN)", "D": "Người lao động tự chi trả 100% kinh phí tham gia học tập"}, "answer": "C", "source": "VBHN 53/VBHN-BQP 2025, Điều 12, Khoản 3", "section": "PHẦN I: LUẬT GDQPAN 2013, VBHN 48 & VBHN 53/VBHN-BQP 2025 (20 CÂU NÂNG CAO)"}, {"id": 4, "q": "Trách nhiệm bảo đảm trang bị vũ khí quân dụng, vật liệu nổ, thiết bị dạy học chuyên dùng và trang phục dùng chung cho các Trung tâm GDQPAN trên toàn quốc thuộc về cơ quan nào theo VBHN 53/VBHN-BQP?", "options": {"A": "Bộ Giáo dục và Đào tạo", "B": "Bộ Quốc phòng", "C": "UBND cấp tỉnh nơi đặt Trung tâm GDQPAN", "D": "Bộ Tài chính phối hợp Bộ Công an"}, "answer": "B", "source": "VBHN 53/VBHN-BQP 2025, Điều 9, Khoản 2", "section": "PHẦN I: LUẬT GDQPAN 2013, VBHN 48 & VBHN 53/VBHN-BQP 2025 (20 CÂU NÂNG CAO)"}, {"id": 5, "q": "Theo VBHN 53/VBHN-BQP 2025, ai có thẩm quyền ký và cấp Giấy chứng nhận hoàn thành bồi dưỡng kiến thức QPAN cho cán bộ thuộc Đối tượng 2 công tác tại các Vụ, Cục thuộc Bộ, ngành Trung ương tại Hà Nội?", "options": {"A": "Giám đốc Học viện Quốc phòng", "B": "Giám đốc Học viện Chính trị (Bộ Quốc phòng)", "C": "Tư lệnh Bộ Tư lệnh Thủ đô Hà Nội", "D": "Bộ trưởng Bộ Giáo dục và Đào tạo"}, "answer": "B", "source": "VBHN 53/VBHN-BQP 2025, Điều 5, Khoản 2", "section": "PHẦN I: LUẬT GDQPAN 2013, VBHN 48 & VBHN 53/VBHN-BQP 2025 (20 CÂU NÂNG CAO)"}, {"id": 6, "q": "Theo Luật GDQPAN 2013 và VBHN 48/VBHN-VPQH, hình thức tổ chức môn học GDQPAN đối với học sinh ở bậc Tiểu học và Trung học cơ sở được quy định như thế nào?", "options": {"A": "Tổ chức giảng dạy thành môn học chính khóa độc lập 35 tiết/năm", "B": "Lồng ghép thông qua nội dung các môn học trong chương trình kết hợp hoạt động ngoại khóa phù hợp lứa tuổi", "C": "Học tập trung 1 tuần tại các Trung tâm GDQPAN địa phương", "D": "Chỉ tổ chức cho học sinh tự nghiên cứu sách giáo khoa và ngoại khóa tự chọn"}, "answer": "B", "source": "Luật GDQPAN 2013, Điều 10; VBHN 48/VBHN-VPQH, Điều 10", "section": "PHẦN I: LUẬT GDQPAN 2013, VBHN 48 & VBHN 53/VBHN-BQP 2025 (20 CÂU NÂNG CAO)"}, {"id": 7, "q": "Theo Luật GDQPAN 2013, nguyên tắc quản lý nhà nước về GDQPAN được phân công giữa các Bộ như thế nào?", "options": {"A": "Bộ Giáo dục và Đào tạo chủ trì, phối hợp Bộ Quốc phòng và Bộ Công an", "B": "Bộ Quốc phòng chủ trì, phối hợp Bộ Công an và Bộ Giáo dục và Đào tạo giúp Chính phủ thống nhất quản lý nhà nước", "C": "Bộ Công an chủ trì toàn bộ nội dung an ninh quốc gia, Bộ Quốc phòng quản lý quốc phòng", "D": "Hội đồng GDQPAN Trung ương trực tiếp điều hành hoạt động của tất cả các nhà trường"}, "answer": "B", "source": "Luật GDQPAN 2013, Điều 6; VBHN 48/VBHN-VPQH, Điều 6", "section": "PHẦN I: LUẬT GDQPAN 2013, VBHN 48 & VBHN 53/VBHN-BQP 2025 (20 CÂU NÂNG CAO)"}, {"id": 8, "q": "Theo VBHN 53/VBHN-BQP 2025, thẩm quyền quyết định triệu tập cán bộ thuộc Đối tượng 2 công tác tại địa phương tham gia bồi dưỡng kiến thức QPAN thuộc về chức danh nào?", "options": {"A": "Bí thư Tỉnh ủy", "B": "Chủ tịch UBND cấp tỉnh", "C": "Chủ tịch Hội đồng Giáo dục quốc phòng và an ninh Quân khu", "D": "Chỉ huy trưởng Bộ Chỉ huy quân sự cấp tỉnh"}, "answer": "C", "source": "VBHN 53/VBHN-BQP 2025, Điều 2, Khoản 2", "section": "PHẦN I: LUẬT GDQPAN 2013, VBHN 48 & VBHN 53/VBHN-BQP 2025 (20 CÂU NÂNG CAO)"}, {"id": 9, "q": "Nghị định 220/2025/NĐ-CP (được hợp nhất trong VBHN 53/VBHN-BQP 2025) bổ sung điều chỉnh nội dung nào sau đây để phù hợp với mô hình quản lý mới?", "options": {"A": "Chuyển toàn bộ giáo viên GDQPAN THPT sang ngạch quân nhân chuyên nghiệp", "B": "Phân định lại thẩm quyền triệu tập, kinh phí và quản lý bồi dưỡng QPAN phù hợp mô hình tổ chức chính quyền địa phương 2 cấp", "C": "Bãi bỏ việc học tập môn GDQPAN tại các trường cao đẳng và đại học", "D": "Giao toàn bộ việc cấp bằng chứng chỉ GDQPAN cho Bộ Công an"}, "answer": "B", "source": "VBHN 53/VBHN-BQP 2025 (cập nhật NĐ 220/2025/NĐ-CP)", "section": "PHẦN I: LUẬT GDQPAN 2013, VBHN 48 & VBHN 53/VBHN-BQP 2025 (20 CÂU NÂNG CAO)"}, {"id": 10, "q": "Theo Luật GDQPAN 2013, hành vi nào sau đây bị nghiêm cấm trong hoạt động GDQPAN?", "options": {"A": "Tổ chức học tập thực hành bắn súng tiểu liên AK tại thao trường quân sự", "B": "Bổ nhiệm giáo viên GDQPAN đạt chuẩn trình độ cử nhân chuyên ngành", "C": "Lợi dụng hoạt động GDQPAN để tuyên truyền xuyên tạc đường lối, chính sách của Đảng, pháp luật của Nhà nước", "D": "Sử dụng mô hình lựu đạn phi kim loại trong giờ học thực hành"}, "answer": "C", "source": "Luật GDQPAN 2013, Điều 9; VBHN 48/VBHN-VPQH, Điều 9", "section": "PHẦN I: LUẬT GDQPAN 2013, VBHN 48 & VBHN 53/VBHN-BQP 2025 (20 CÂU NÂNG CAO)"}, {"id": 11, "q": "Theo VBHN 53/VBHN-BQP 2025, việc bảo đảm ngân sách chi cho hoạt động GDQPAN của cơ quan nhà nước cấp tỉnh do nguồn ngân sách nào chi trả?", "options": {"A": "Ngân sách Trung ương phân bổ riêng cho Bộ Quốc phòng", "B": "Ngân sách địa phương cấp tỉnh bảo đảm theo quy định của Luật Ngân sách nhà nước", "C": "Nguồn thu học phí của các cơ sở giáo dục trên địa bàn", "D": "Quỹ quốc phòng an ninh do doanh nghiệp đóng góp"}, "answer": "B", "source": "VBHN 53/VBHN-BQP 2025, Điều 10, Khoản 2", "section": "PHẦN I: LUẬT GDQPAN 2013, VBHN 48 & VBHN 53/VBHN-BQP 2025 (20 CÂU NÂNG CAO)"}, {"id": 12, "q": "Theo Luật GDQPAN 2013, đối tượng nào sau đây thuộc diện được miễn học môn GDQPAN trong các cơ sở giáo dục?", "options": {"A": "Học sinh có kết quả học tập môn Thể dục đạt loại Giỏi", "B": "Học sinh có giấy chứng nhận thương binh hoặc có bệnh lý đợt cấp được cơ quan y tế có thẩm quyền xác nhận", "C": "Học sinh là con em cán bộ lực lượng vũ trang", "D": "Học sinh đã tham gia các câu lạc bộ thể thao quốc phòng ngoài nhà trường"}, "answer": "B", "source": "Luật GDQPAN 2013, Điều 13", "section": "PHẦN I: LUẬT GDQPAN 2013, VBHN 48 & VBHN 53/VBHN-BQP 2025 (20 CÂU NÂNG CAO)"}, {"id": 13, "q": "Theo VBHN 53/VBHN-BQP 2025, mẫu Giấy chứng nhận hoàn thành bồi dưỡng kiến thức QPAN do cơ quan nào ban hành thống nhất trên toàn quốc?", "options": {"A": "Bộ Giáo dục và Đào tạo", "B": "Bộ Quốc phòng", "C": "Học viện Quốc phòng", "D": "Bộ Công an"}, "answer": "B", "source": "VBHN 53/VBHN-BQP 2025, Điều 5, Khoản 4", "section": "PHẦN I: LUẬT GDQPAN 2013, VBHN 48 & VBHN 53/VBHN-BQP 2025 (20 CÂU NÂNG CAO)"}, {"id": 14, "q": "Theo VBHN 53/VBHN-BQP 2025, đối tượng 3 bao gồm những chức danh cán bộ nào sau đây tại địa phương?", "options": {"A": "Đại biểu Quốc hội, Sĩ quan cấp tướng", "B": "Trưởng phòng, Phó Trưởng phòng thuộc sở, ban, ngành cấp tỉnh và tương đương; Bí thư, Chủ tịch UBND cấp huyện", "C": "Trưởng thôn, Tổ trưởng tổ dân phố, Bí thư chi bộ thôn", "D": "Toàn bộ giáo viên các trường phổ thông trên địa bàn"}, "answer": "B", "source": "VBHN 53/VBHN-BQP 2025, Điều 2, Khoản 3", "section": "PHẦN I: LUẬT GDQPAN 2013, VBHN 48 & VBHN 53/VBHN-BQP 2025 (20 CÂU NÂNG CAO)"}, {"id": 15, "q": "Theo Luật GDQPAN 2013, yêu cầu chuẩn trình độ đào tạo đối với giáo viên GDQPAN chuyên trách tại các trường THPT là gì?", "options": {"A": "Có bằng tốt nghiệp trung cấp quân sự hoặc chứng chỉ quốc phòng 3 tháng", "B": "Có bằng cử nhân giáo dục quốc phòng và an ninh hoặc bằng cử nhân chuyên ngành khác kèm chứng chỉ đào tạo GDQPAN", "C": "Phải là sĩ quan quân đội tại ngũ được điều động về trường", "D": "Chỉ cần hoàn thành nghĩa vụ quân sự trở về"}, "answer": "B", "source": "Luật GDQPAN 2013, Điều 22", "section": "PHẦN I: LUẬT GDQPAN 2013, VBHN 48 & VBHN 53/VBHN-BQP 2025 (20 CÂU NÂNG CAO)"}, {"id": 16, "q": "Theo VBHN 53/VBHN-BQP 2025, nhiệm vụ quản lý, lưu trữ hồ sơ bồi dưỡng kiến thức QPAN của Đối tượng 1 do đơn vị nào trực tiếp phụ trách?", "options": {"A": "Ban Tổ chức Trung ương", "B": "Học viện Quốc phòng", "C": "Bộ Tổng Tham mưu", "D": "Cục Quân huấn - Bộ Quốc phòng"}, "answer": "B", "source": "VBHN 53/VBHN-BQP 2025, Điều 5, Khoản 1", "section": "PHẦN I: LUẬT GDQPAN 2013, VBHN 48 & VBHN 53/VBHN-BQP 2025 (20 CÂU NÂNG CAO)"}, {"id": 17, "q": "Theo Luật GDQPAN 2013, Ngày truyền thống Giáo dục quốc phòng và an ninh Việt Nam được quy định là ngày nào?", "options": {"A": "Ngày 22 tháng 12", "B": "Ngày 19 tháng 5", "C": "Ngày 03 tháng 5", "D": "Ngày 10 tháng 8"}, "answer": "C", "source": "Luật GDQPAN 2013, Điều 7", "section": "PHẦN I: LUẬT GDQPAN 2013, VBHN 48 & VBHN 53/VBHN-BQP 2025 (20 CÂU NÂNG CAO)"}, {"id": 18, "q": "Theo VBHN 53/VBHN-BQP 2025, cơ quan nào có thẩm quyền phê duyệt Kế hoạch bồi dưỡng kiến thức QPAN hàng năm cho cán bộ thuộc Đối tượng 2 của các Quân khu?", "options": {"A": "Thủ tướng Chính phủ", "B": "Bộ trưởng Bộ Quốc phòng", "C": "Tư lệnh Quân khu", "D": "Chủ tịch UBND cấp tỉnh nơi quân khu đóng quân"}, "answer": "B", "source": "VBHN 53/VBHN-BQP 2025, Điều 4, Khoản 2", "section": "PHẦN I: LUẬT GDQPAN 2013, VBHN 48 & VBHN 53/VBHN-BQP 2025 (20 CÂU NÂNG CAO)"}, {"id": 19, "q": "Theo VBHN 53/VBHN-BQP 2025, thời gian một khóa bồi dưỡng kiến thức QPAN cho cán bộ thuộc Đối tượng 2 được quy định tối thiểu là bao nhiêu ngày?", "options": {"A": "05 ngày", "B": "12 ngày", "C": "15 ngày", "D": "30 ngày"}, "answer": "C", "source": "VBHN 53/VBHN-BQP 2025, Điều 6, Khoản 2", "section": "PHẦN I: LUẬT GDQPAN 2013, VBHN 48 & VBHN 53/VBHN-BQP 2025 (20 CÂU NÂNG CAO)"}, {"id": 20, "q": "Theo Luật GDQPAN 2013, trung tâm GDQPAN được thành lập trong các cơ sở giáo dục đại học phải bảo đảm điều kiện cốt lõi nào sau đây?", "options": {"A": "Phải có ít nhất 100 súng tiểu liên AK thật đã niêm phong", "B": "Có đủ điều kiện về đội ngũ giảng viên, thao trường tập luyện, sĩ số sinh viên quy mô tối thiểu và hệ thống hạ tầng quân sự chuyên dùng", "C": "Phải do Bộ Công an trực tiếp quản lý và vận hành", "D": "Chỉ phục vụ cho sinh viên chuyên ngành quân sự"}, "answer": "B", "source": "Luật GDQPAN 2013, Điều 15, 16", "section": "PHẦN I: LUẬT GDQPAN 2013, VBHN 48 & VBHN 53/VBHN-BQP 2025 (20 CÂU NÂNG CAO)"}, {"id": 21, "q": "Theo Thông tư 46/2020/TT-BGDĐT, tổ chức giảng dạy các bài học THỰC HÀNH môn GDQPAN cấp THPT phải tuân thủ nghiêm ngặt nguyên tắc nào sau đây?", "options": {"A": "Dạy đan xen 1 tiết lý thuyết - 1 tiết thực hành trong cùng buổi học", "B": "Dạy tập trung theo lớp, dạy dứt điểm theo bài, thời lượng thực hành tập trung không quá 3 tiết/buổi/tuần", "C": "Gom toàn bộ tiết thực hành dạy 1 đợt tập trung vào tuần cuối cùng của năm học", "D": "Cho học sinh tự thực hành tại nhà qua video hướng dẫn của giáo viên"}, "answer": "B", "source": "Thông tư 46/2020/TT-BGDĐT, Mục V - Hướng dẫn thực hiện chương trình", "section": "PHẦN II: THÔNG TƯ 46/2020, THÔNG TƯ 19/2022 & KHUNG NĂNG LỰC SỐ TT 02/2025 (20 CÂU NÂNG CAO)"}, {"id": 22, "q": "Trong tổng số 35 tiết môn GDQPAN ở lớp 10 theo Thông tư 46/2020/TT-BGDĐT, tỉ lệ phân bổ thời lượng giữa Lý thuyết và Thực hành (bao gồm cả tiết kiểm tra) là bao nhiêu?", "options": {"A": "20 tiết lý thuyết, 15 tiết thực hành", "B": "18 tiết lý thuyết, 17 tiết thực hành", "C": "15 tiết lý thuyết, 20 tiết thực hành", "D": "12 tiết lý thuyết, 23 tiết thực hành"}, "answer": "B", "source": "Thông tư 46/2020/TT-BGDĐT, Phụ lục Chương trình môn GDQPAN Lớp 10", "section": "PHẦN II: THÔNG TƯ 46/2020, THÔNG TƯ 19/2022 & KHUNG NĂNG LỰC SỐ TT 02/2025 (20 CÂU NÂNG CAO)"}, {"id": 23, "q": "Theo Thông tư 19/2022/TT-BGDĐT, thiết bị danh mục tối thiểu môn GDQPAN cấp THPT quy định chuẩn mực đối với mô hình súng tiểu liên AK phục vụ giảng dạy phải bảo đảm yêu cầu kỹ thuật nào?", "options": {"A": "Phải là súng AK thật tháo đạn", "B": "Phải có kích thước, khối lượng và cấu tạo cơ bản tương đương súng thật, tháo lắp chuyển động được các bộ phận cơ bản", "C": "Chỉ cần mô hình súng đúc bằng nhựa nguyên khối không tháo lắp được", "D": "Mô hình súng bắn đạn nhựa mềm để tập ngắm"}, "answer": "B", "source": "Thông tư 19/2022/TT-BGDĐT, Danh mục thiết bị dạy học THPT", "section": "PHẦN II: THÔNG TƯ 46/2020, THÔNG TƯ 19/2022 & KHUNG NĂNG LỰC SỐ TT 02/2025 (20 CÂU NÂNG CAO)"}, {"id": 24, "q": "Theo Thông tư 19/2022/TT-BGDĐT, trang phục dã chiến đồng bộ cấp phát cho giáo viên chuyên trách GDQPAN cấp THPT gồm những chi tiết trang phục chuẩn nào?", "options": {"A": "Áo thun cổ tròn, quần bò, giày thể thao trắng", "B": "Quần áo dã chiến màu rằn ri K07/K19, mũ dã chiến (mũ mềm), giày vải cao cổ quân nhu, biển tên và cấp hiệu theo quy định", "C": "Áo sơ mi trắng, quần tây đen, giày da đen", "D": "Bộ quân phục lễ phục mùa hè kèm mũ kepi"}, "answer": "B", "source": "Thông tư 19/2022/TT-BGDĐT, Quy định trang phục giáo viên GDQPAN", "section": "PHẦN II: THÔNG TƯ 46/2020, THÔNG TƯ 19/2022 & KHUNG NĂNG LỰC SỐ TT 02/2025 (20 CÂU NÂNG CAO)"}, {"id": 25, "q": "Theo Khung năng lực số cho người học (Thông tư 02/2025/TT-BGDĐT), cấu trúc chuẩn của Khung năng lực số bao gồm bao nhiêu Miền năng lực và Năng lực thành phần?", "options": {"A": "4 Miền năng lực, 16 Năng lực thành phần", "B": "5 Miền năng lực, 20 Năng lực thành phần", "C": "6 Miền năng lực, 24 Năng lực thành phần", "D": "8 Miền năng lực, 32 Năng lực thành phần"}, "answer": "C", "source": "Khung năng lực số người học (TT 02/2025/TT-BGDĐT), Mục II", "section": "PHẦN II: THÔNG TƯ 46/2020, THÔNG TƯ 19/2022 & KHUNG NĂNG LỰC SỐ TT 02/2025 (20 CÂU NÂNG CAO)"}, {"id": 26, "q": "Miền năng lực số thứ 6 được bổ sung mới hoàn toàn trong Khung năng lực số người học (TT 02/2025/TT-BGDĐT) có tên gọi chính xác là gì?", "options": {"A": "Sáng tạo sản phẩm truyền thông đa phương tiện", "B": "Ứng dụng Trí tuệ nhân tạo (AI) có trách nhiệm", "C": "An toàn không gian mạng và bảo vệ dữ liệu cá nhân", "D": "Lập trình phát triển ứng dụng di động"}, "answer": "B", "source": "Khung năng lực số người học (TT 02/2025/TT-BGDĐT), Miền 6", "section": "PHẦN II: THÔNG TƯ 46/2020, THÔNG TƯ 19/2022 & KHUNG NĂNG LỰC SỐ TT 02/2025 (20 CÂU NÂNG CAO)"}, {"id": 27, "q": "Theo Khung năng lực số người học (TT 02/2025/TT-BGDĐT), năng lực số của người học được phân thành mấy Trình độ và mấy Bậc phát triển?", "options": {"A": "3 Trình độ, 6 Bậc", "B": "4 Trình độ, 8 Bậc", "C": "5 Trình độ, 10 Bậc", "D": "6 Trình độ, 12 Bậc"}, "answer": "B", "source": "Khung năng lực số người học (TT 02/2025/TT-BGDĐT), Mục III", "section": "PHẦN II: THÔNG TƯ 46/2020, THÔNG TƯ 19/2022 & KHUNG NĂNG LỰC SỐ TT 02/2025 (20 CÂU NÂNG CAO)"}, {"id": 28, "q": "Theo Thông tư 46/2020/TT-BGDĐT, việc đánh giá kết quả học tập môn GDQPAN của học sinh THPT được xếp loại theo hình thức nào?", "options": {"A": "Chấm điểm theo thang điểm 10 (từ 0 đến 10 điểm)", "B": "Đánh giá theo 2 mức: Đạt (Đ) và Chưa đạt (CĐ)", "C": "Xếp loại theo 4 mức: Giỏi, Khá, Trung bình, Yếu", "D": "Đánh giá bằng nhận xét năng lực không ghi học bạ"}, "answer": "B", "source": "Thông tư 46/2020/TT-BGDĐT, Mục VI - Đánh giá kết quả học tập", "section": "PHẦN II: THÔNG TƯ 46/2020, THÔNG TƯ 19/2022 & KHUNG NĂNG LỰC SỐ TT 02/2025 (20 CÂU NÂNG CAO)"}, {"id": 29, "q": "Trong Chương trình GDQPAN Lớp 11 theo Thông tư 46/2020/TT-BGDĐT, nội dung thực hành 'Tháo, lắp súng tiểu liên AK' thuộc về Chủ đề nào?", "options": {"A": "Chủ đề 1: Một số hiểu biết chung về quốc phòng và an ninh", "B": "Chủ đề 2: Điều lệnh đội ngũ và Kỹ thuật chiến thuật bộ binh", "C": "Chủ đề 3: Giới thiệu một số loại súng bộ binh, thuốc nổ, vật cản và vũ khí tự tạo", "D": "Chủ đề 4: Kỹ thuật cứu thương và phòng chống thiên tai"}, "answer": "C", "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình Lớp 11", "section": "PHẦN II: THÔNG TƯ 46/2020, THÔNG TƯ 19/2022 & KHUNG NĂNG LỰC SỐ TT 02/2025 (20 CÂU NÂNG CAO)"}, {"id": 30, "q": "Theo Thông tư 19/2022/TT-BGDĐT, số lượng danh mục trang thiết bị tối thiểu mô hình lựu đạn tập (lựu đạn F-1 hoặc LĐ-01) trang bị cho 1 lớp học THPT chuẩn là bao nhiêu quả?", "options": {"A": "05 quả/lớp", "B": "10 quả/lớp", "C": "15 quả/lớp", "D": "20 quả/lớp"}, "answer": "C", "source": "Thông tư 19/2022/TT-BGDĐT, Danh mục thiết bị khối 11", "section": "PHẦN II: THÔNG TƯ 46/2020, THÔNG TƯ 19/2022 & KHUNG NĂNG LỰC SỐ TT 02/2025 (20 CÂU NÂNG CAO)"}, {"id": 31, "q": "Theo Khung năng lực số người học (TT 02/2025/TT-BGDĐT), học sinh THPT (Khối 10-12) cần đạt chuẩn năng lực số tối thiểu ở Bậc nào?", "options": {"A": "Bậc 1 - Cơ bản 1", "B": "Bậc 3 - Trung cấp 1", "C": "Bậc 5 - Nâng cao 1", "D": "Bậc 7 - Chuyên sâu 1"}, "answer": "B", "source": "Khung năng lực số người học (TT 02/2025/TT-BGDĐT), Chuẩn đầu ra cấp THPT", "section": "PHẦN II: THÔNG TƯ 46/2020, THÔNG TƯ 19/2022 & KHUNG NĂNG LỰC SỐ TT 02/2025 (20 CÂU NÂNG CAO)"}, {"id": 32, "q": "Theo Thông tư 46/2020/TT-BGDĐT, nội dung nào sau đây ĐÚNG khi nói về kiểm tra định kỳ môn GDQPAN?", "options": {"A": "Phải thực hiện kiểm tra viết 45 phút trên giấy đối với tất cả các bài thực hành", "B": "Được tổ chức vào cuối học kỳ I và cuối năm học bằng hình thức trắc nghiệm, tự luận hoặc thực hành", "C": "Không tổ chức kiểm tra học kỳ mà lấy điểm trung bình các bài tập kiểm tra miệng", "D": " từng nhà trường"}, "answer": "B", "source": "Thông tư 19/2022/TT-BGDĐT, Quy chuẩn biển tên giáo viên", "section": "PHẦN II: THÔNG TƯ 46/2020, THÔNG TƯ 19/2022 & KHUNG NĂNG LỰC SỐ TT 02/2025 (20 CÂU NÂNG CAO)"}, {"id": 40, "q": "Theo Thông tư 46/2020/TT-BGDĐT, tổng thời lượng toàn cấp THPT của môn GDQPAN là 105 tiết. Nếu tính riêng thời lượng dành cho Lý thuyết toàn cấp là bao nhiêu tiết?", "options": {"A": "40 tiết lý thuyết", "B": "52 tiết lý thuyết", "C": "60 tiết lý thuyết", "D": "70 tiết lý thuyết"}, "answer": "B", "source": "Thông tư 46/2020/TT-BGDĐT, Thống kê tổng hợp lý thuyết 3 khối", "section": "PHẦN II: THÔNG TƯ 46/2020, THÔNG TƯ 19/2022 & KHUNG NĂNG LỰC SỐ TT 02/2025 (20 CÂU NÂNG CAO)"}, {"id": 41, "q": "Trong kỹ thuật bắn súng tiểu liên AK (Bài 6 - SGK GDQPAN 12), yếu tố nào sau đây giữ vai trò QUYẾT ĐỊNH trực tiếp đến độ trúng chụm của đường đạn khi siết cò?", "options": {"A": "Giữ súng thật chặt không cho súng nhúc nhích", "B": "Giữ đường ngắm đúng ổn định, êm nảy siết cò đều về sau cho đến khi đạn nổ", "C": "Nín thở thật lâu trước khi ngắm vào mục tiêu", "D": "Mở to cả hai mắt khi ngắm bắn"}, "answer": "B", "source": "SGK GDQPAN 12, Bài 6 - Kĩ thuật bắn súng tiểu liên AK, Trang 48", "section": "PHẦN III: KỸ THUẬT - CHIẾN THUẬT QUÂN SỰ VÀ SGK GDQPAN 10-11-12 (25 CÂU NÂNG CAO)"}, {"id": 42, "q": "Khái niệm 'Đường ngắm đúng' trong bắn súng tiểu liên AK được định nghĩa chuẩn xác như thế nào trong SGK GDQPAN 11 & 12?", "options": {"A": "Đường thẳng từ mắt người bắn qua điểm chính giữa mép trên thước ngắm đến mục tiêu", "B": "Đường ngắm cơ bản được dóng vào điểm định ngắm đã xác định trên mục tiêu với điều kiện mặt súng không nghiêng", "C": "Đường thẳng nối từ kim hỏa qua nòng súng tới trung tâm bia", "D": "Đường cong quỹ đạo của đầu đạn bay trong không trung"}, "answer": "B", "source": "SGK GDQPAN 11, Bài 6 & SGK GDQPAN 12, Bài 6", "section": "PHẦN III: KỸ THUẬT - CHIẾN THUẬT QUÂN SỰ VÀ SGK GDQPAN 10-11-12 (25 CÂU NÂNG CAO)"}, {"id": 43, "q": "Khi học sinh thực hành ngắm bắn súng AK, nếu mặt súng bị nghiêng sang PHẢI thì điểm chạm của đầu đạn trên mục tiêu sẽ lệch về hướng nào?", "options": {"A": "Lệch lên trên và sang trái", "B": "Lệch xuống dưới và sang phải", "C": "Lệch thẳng lên trên", "D": "Lệch thẳng xuống dưới"}, "answer": "B", "source": "SGK GDQPAN 12, Bài 6 - Kĩ thuật ngắm bắn và hiện tượng lệch đạn", "section": "PHẦN III: KỸ THUẬT - CHIẾN THUẬT QUÂN SỰ VÀ SGK GDQPAN 10-11-12 (25 CÂU NÂNG CAO)"}, {"id": 44, "q": "Trong thực hành tháo súng tiểu liên AK thông thường (Bài 6 - SGK GDQPAN 11), bước thứ 3 theo đúng thứ tự quy trình kỹ thuật là tháo bộ phận nào?", "options": {"A": "Tháo thông nòng", "B": "Tháo nắp hộp khóa nòng", "C": "Tháo ống dẫn thoi và ốp lót tay", "D": "Tháo bộ phận đẩy về"}, "answer": "B", "source": "SGK GDQPAN 11, Bài 6 - Quy trình tháo súng AK 7 bước", "section": "PHẦN III: KỸ THUẬT - CHIẾN THUẬT QUÂN SỰ VÀ SGK GDQPAN 10-11-12 (25 CÂU NÂNG CAO)"}, {"id": 45, "q": "Tính năng kĩ thuật của súng tiểu liên AK (Bài 6 - SGK GDQPAN 11): Tầm bắn hiệu quả nhất của súng AK đối với mục tiêu mặt đất, mặt nước là bao nhiêu mét?", "options": {"A": "100m", "B": "400m", "C": "800m", "D": "1000m"}, "answer": "B", "source": "SGK GDQPAN 11, Bài 6 - Tính năng số liệu súng AK", "section": "PHẦN III: KỸ THUẬT - CHIẾN THUẬT QUÂN SỰ VÀ SGK GDQPAN 10-11-12 (25 CÂU NÂNG CAO)"}, {"id": 46, "q": "Tốc độ bắn lý thuyết của súng tiểu liên AK được xác định là bao nhiêu phát/phút?", "options": {"A": "100 phát/phút", "B": "400 phát/phút", "C": "600 phát/phút", "D": "1000 phát/phút"}, "answer": "C", "source": "SGK GDQPAN 11, Bài 6 - Số liệu kĩ thuật súng AK", "section": "PHẦN III: KỸ THUẬT - CHIẾN THUẬT QUÂN SỰ VÀ SGK GDQPAN 10-11-12 (25 CÂU NÂNG CAO)"}, {"id": 47, "q": "Trong bài Kỹ thuật sử dụng lựu đạn (Bài 10 - SGK GDQPAN 11), bán kính sát thương bằng mảnh văng của lựu đạn F-1 được quy định là bao nhiêu mét?", "options": {"A": "5m", "B": "10m", "C": "20m", "D": "50m"}, "answer": "C", "source": "SGK GDQPAN 11, Bài 10 - Kỹ thuật sử dụng lựu đạn F-1", "section": "PHẦN III: KỸ THUẬT - CHIẾN THUẬT QUÂN SỰ VÀ SGK GDQPAN 10-11-12 (25 CÂU NÂNG CAO)"}, {"id": 48, "q": "Thời gian cháy chậm của kíp lựu đạn F-1 và LĐ-01 kể từ khi mỏ vịt bật khỏi tay đến khi nổ là bao nhiêu giây?", "options": {"A": "1 - 2 giây", "B": "3,2 - 4,2 giây", "C": "5 - 6 giây", "D": "7 - 8 giây"}, "answer": "B", "source": "SGK GDQPAN 11, Bài 10 - Tính năng lựu đạn tập", "section": "PHẦN III: KỸ THUẬT - CHIẾN THUẬT QUÂN SỰ VÀ SGK GDQPAN 10-11-12 (25 CÂU NÂNG CAO)"}, {"id": 49, "q": "Trong bài 'Lợi dụng địa hình, địa vật' (Bài 8 - SGK GDQPAN 11), địa vật nào sau đây được phân loại thuộc nhóm 'Vật che đỡ'?", "options": {"A": "Lùm cây nhỏ, bụi cỏ cao", "B": "Rãnh nước nông, ngô dại", "C": "U đất dày, bức tường gạch kiên cố, gốc cây cổ thụ lớn", "D": "Giàn hoa lá thưa"}, "answer": "C", "source": "SGK GDQPAN 11, Bài 8 - Phân biệt Vật che khuất và Vật che đỡ", "section": "PHẦN III: KỸ THUẬT - CHIẾN THUẬT QUÂN SỰ VÀ SGK GDQPAN 10-11-12 (25 CÂU NÂNG CAO)"}, {"id": 50, "q": "Sự khác biệt căn bản giữa 'Vật che khuất' và 'Vật che đỡ' trong chiến thuật quân sự (Bài 8 - SGK 11) là gì?", "options": {"A": "Vật che khuất chống được đạn, vật che đỡ chỉ che mắt địch", "B": "Vật che khuất chỉ có tác dụng giấu kín hành động che mắt nhìn của địch; Vật che đỡ vừa che mắt địch vừa chống đỡ được hỏa lực bắn thẳng", "C": "Cả hai vật đều có khả năng chống được bom đạn như nhau", "D": "Vật che đỡ chỉ dùng trong ban đêm, vật che khuất dùng ban ngày"}, "answer": "B", "source": "SGK GDQPAN 11, Bài 8 - Khái niệm nguyên tắc lợi dụng địa hình", "section": "PHẦN III: KỸ THUẬT - CHIẾN THUẬT QUÂN SỰ VÀ SGK GDQPAN 10-11-12 (25 CÂU NÂNG CAO)"}, {"id": 51, "q": "Động tác 'Trườn' trong bài Các tư thế vận động trong chiến đấu (Bài 11 - SGK GDQPAN 11) được vận dụng trong trường hợp thực địa nào?", "options": {"A": "Nơi địa hình bằng phẳng có vật che khuất cao hơn tư thế người ngồi", "B": "Nơi địa hình rất trống trải, địa vật che khuất che đỡ rất thấp (khoảng 20-30cm), ở gần địch cần thu hẹp diện tích cơ thể", "C": "Nơi địa hình đồi núi dốc đứng", "D": "Khi cơ động nhanh qua mặt đường nhựa công cộng"}, "answer": "B", "source": "SGK GDQPAN 11, Bài 11 - Động tác Trườn, Bò, Vọt tiến", "section": "PHẦN III: KỸ THUẬT - CHIẾN THUẬT QUÂN SỰ VÀ SGK GDQPAN 10-11-12 (25 CÂU NÂNG CAO)"}, {"id": 52, "q": "Trong tư thế 'Nằm bắn súng AK có bệ tỳ' (Bài 6 - SGK GDQPAN 12), góc tạo bởi thân người bắn với hướng bắn chuẩn xác là bao nhiêu độ?", "options": {"A": "Tạo thành góc khoảng 15 đến 30 độ", "B": "Tạo thành góc khoảng 30 đến 45 độ", "C": "Tạo thành góc vuông 90 độ", "D": "Thân người nằm thẳng song song 0 độ với hướng bắn"}, "answer": "B", "source": "SGK GDQPAN 12, Bài 6 - Tư thế nằm bắn súng AK", "section": "PHẦN III: KỸ THUẬT - CHIẾN THUẬT QUÂN SỰ VÀ SGK GDQPAN 10-11-12 (25 CÂU NÂNG CAO)"}, {"id": 53, "q": "Khi bắn súng AK, nếu điểm ngắm đúng nhưng ngắm Đường ngắm cơ bản bị 'Cao' (đầu ruồi cao hơn mép trên thước ngắm) thì điểm đạn nổ trên mục tiêu sẽ ra sao?", "options": {"A": "Đạn bị ăn xuống thấp", "B": "Đạn bị ăn lên cao hơn điểm định ngắm", "C": "Đạn bay lệch sang trái", "D": "Đạn bay lệch sang phải"}, "answer": "B", "source": "SGK GDQPAN 12, Bài 6 - Nguyên lý lệch đạn do ngắm sai", "section": "PHẦN III: KỸ THUẬT - CHIẾN THUẬT QUÂN SỰ VÀ SGK GDQPAN 10-11-12 (25 CÂU NÂNG CAO)"}, {"id": 54, "q": "Trong bài Tìm và giữ phương hướng (Bài 7 - SGK GDQPAN 12), khi sử dụng La bàn xác định góc hướng đi, kim la bàn chỉ vạch Bắc (N) phải trùng với góc bao nhiêu độ?", "options": {"A": "0 độ (hoặc 360 độ)", "B": "90 độ", "C": "180 độ", "D": "270 độ"}, "answer": "A", "source": "SGK GDQPAN 12, Bài 7 - Kỹ thuật sử dụng La bàn", "section": "PHẦN III: KỸ THUẬT - CHIẾN THUẬT QUÂN SỰ VÀ SGK GDQPAN 10-11-12 (25 CÂU NÂNG CAO)"}, {"id": 55, "q": "Phương pháp xác định phương hướng ban đêm bằng quan sát Cung sao (Bài 7 - SGK GDQPAN 12): Chùm sao nào sau đây được sử dụng để xác định hướng BẮC?", "options": {"A": "Chùm sao Thần Nông (Scorpius)", "B": "Chùm sao Đại Hùng (Chòm sao Bắc Đẩu / Kim Quy)", "C": "Chùm sao Tam Tai", "D": "Chùm sao Kim Ngưu"}, "answer": "B", "source": "SGK GDQPAN 12, Bài 7 - Xác định hướng Bắc bằng chòm sao Bắc Đẩu", "section": "PHẦN III: KỸ THUẬT - CHIẾN THUẬT QUÂN SỰ VÀ SGK GDQPAN 10-11-12 (25 CÂU NÂNG CAO)"}, {"id": 56, "q": "Trong thao tác lắp súng tiểu liên AK sau khi lau chùi (Bài 6 - SGK 11), bộ phận nào được lắp vào ĐẦU TIÊN?", "options": {"A": "Nắp hộp khóa nòng", "B": "Ống dẫn thoi và ốp lót tay", "C": "Bộ phận đẩy về", "D": "Tay quay gạt khâu khống chế ốp lót tay"}, "answer": "B", "source": "SGK GDQPAN 11, Bài 6 - Quy trình lắp súng ngược quy trình tháo", "section": "PHẦN III: KỸ THUẬT - CHIẾN THUẬT QUÂN SỰ VÀ SGK GDQPAN 10-11-12 (25 CÂU NÂNG CAO)"}, {"id": 57, "q": "Trong bài Kỹ thuật cứu thương (Bài 12 - SGK GDQPAN 10), nguyên tắc vàng ĐẦU TIÊN khi xử lý cấp cứu vết thương chảy máu động mạch lớn ở cẳng tay là gì?", "options": {"A": "Cho nạn nhân uống thuốc giảm đau ngay lập tức", "B": "Ấn động mạch cầm máu tạm thời ngay lập tức, sau đó đặt garô khẩn cấp phía trên vết thương", "C": "Rửa sạch vết thương bằng nước xà phòng", "D": "Băng ép chặt trực tiếp lên vết thương rồi chở đi viện"}, "answer": "B", "source": "SGK GDQPAN 10, Bài 12 - Kỹ thuật cầm máu động mạch", "section": "PHẦN III: KỸ THUẬT - CHIẾN THUẬT QUÂN SỰ VÀ SGK GDQPAN 10-11-12 (25 CÂU NÂNG CAO)"}, {"id": 58, "q": "Khi đặt dây Garô cầm máu vết thương động mạch (Bài 12 - SGK 10), thời gian tối đa được phép để dây garô liên tục không nới là bao nhiêu phút?", "options": {"A": "15 - 20 phút", "B": "60 - 90 phút (mỗi 60 phút nới garô 1 lần 1-2 phút)", "C": "180 phút", "D": "240 phút"}, "answer": "B", "source": "SGK GDQPAN 10, Bài 12 - Quy tắc nới garô an toàn", "section": "PHẦN III: KỸ THUẬT - CHIẾN THUẬT QUÂN SỰ VÀ SGK GDQPAN 10-11-12 (25 CÂU NÂNG CAO)"}, {"id": 59, "q": "Trong bài Vận dụng các tư thế vận động trong chiến đấu (Bài 8 - SGK GDQPAN 12), động tác 'Vọt tiến' được áp dụng khi nào?", "options": {"A": "Khi vượt qua khoảng trống ngắn, che đỡ thấp dưới hỏa lực bất ngờ của địch", "B": "Khi di chuyển từ nơi ẩn nấp này sang nơi ẩn nấp khác qua khoảng trống địa hình trống trải dưới tầm nhìn hoặc hỏa lực địch", "C": "Khi thu dọn vệ sinh thao trường ban ngày", "D": "Khi tuần tra ban đêm ngoài hàng rào"}, "answer": "B", "source": "SGK GDQPAN 12, Bài 8 - Động tác vọt tiến trong thực chiến", "section": "PHẦN III: KỸ THUẬT - CHIẾN THUẬT QUÂN SỰ VÀ SGK GDQPAN 10-11-12 (25 CÂU NÂNG CAO)"}, {"id": 60, "q": "Kích thước của Bia số 4 (Bia ngực) dùng trong bài thi bắn đạn thật súng tiểu liên AK cự ly 100m là bao nhiêu cm?", "options": {"A": "0,5m x 0,5m", "B": "0,75m x 0,75m (75cm x 75cm)", "C": "1,0m x 1,0m", "D": "1,2m x 1,5m"}, "answer": "B", "source": "SGK GDQPAN 12, Bài 6 & Quy chuẩn Bia số 4 Bộ Quốc phòng", "section": "PHẦN III: KỸ THUẬT - CHIẾN THUẬT QUÂN SỰ VÀ SGK GDQPAN 10-11-12 (25 CÂU NÂNG CAO)"}, {"id": 61, "q": "Khi thực hành ném lựu đạn F-1 trúng đích (Bài 10 - SGK 11), tư thế ném lựu đạn 'Đứng ném' thường vận dụng trong điều kiện địa hình nào?", "options": {"A": "Khi nấp sau vật che đỡ cao (như giao thông hào, bức tường cao), địa hình trống trải không có hỏa lực địch", "B": "Khi đang nằm ngửa dưới bãi cỏ thấp", "C": "Khi đang bò trườn trên mặt đường", "D": "Khi đang ngâm mình dưới nước sâu"}, "answer": "A", "source": "SGK GDQPAN 11, Bài 10 - Tư thế đứng ném lựu đạn", "section": "PHẦN III: KỸ THUẬT - CHIẾN THUẬT QUÂN SỰ VÀ SGK GDQPAN 10-11-12 (25 CÂU NÂNG CAO)"}, {"id": 62, "q": "Trong quy tắc ngắm bắn súng AK, 'Thước ngắm 3' tương ứng với cự ly ngắm bắn chuẩn là bao nhiêu mét?", "options": {"A": "100m", "B": "200m", "C": "300m", "D": "400m"}, "answer": "C", "source": "SGK GDQPAN 12, Bài 6 - Chọn thước ngắm và điểm ngắm", "section": "PHẦN III: KỸ THUẬT - CHIẾN THUẬT QUÂN SỰ VÀ SGK GDQPAN 10-11-12 (25 CÂU NÂNG CAO)"}, {"id": 63, "q": "Nguyên nhân chính dẫn đến hiện tượng đạn nổ bị 'Ăn sang TRÁI' khi thực hành bắn súng AK là gì?", "options": {"A": "Thước ngắm chọn quá cao", "B": "Đầu ruồi lệch sang bên phải so với khe ngắm", "C": "Đầu ruồi lệch sang bên trái so với khe ngắm hoặc giật cò nghiêng mặt súng sang trái", "D": "Do người bắn nín thở quá lâu"}, "answer": "C", "source": "SGK GDQPAN 12, Bài 6 - Hiện tượng lệch đạn sang trái", "section": "PHẦN III: KỸ THUẬT - CHIẾN THUẬT QUÂN SỰ VÀ SGK GDQPAN 10-11-12 (25 CÂU NÂNG CAO)"}, {"id": 64, "q": "Động tác 'Bò mạp' (Bài 11 - SGK GDQPAN 11) khác với động tác 'Trườn' ở điểm cốt lõi nào?", "options": {"A": "Trườn dùng 2 tay và 2 chân co kéo áp sát bụng xuống đất; Bò mạp dùng cẳng tay và cẳng chân để nâng nhẹ thân người vận động qua vật che đỡ cao hơn", "B": "Trườn đi nhanh hơn bò mạp", "C": "Bò mạp chỉ áp dụng cho đêm tối", "D": "Trườn không mang theo vũ khí"}, "answer": "A", "source": "SGK GDQPAN 11, Bài 11 - So sánh trườn và bò mạp", "section": "PHẦN III: KỸ THUẬT - CHIẾN THUẬT QUÂN SỰ VÀ SGK GDQPAN 10-11-12 (25 CÂU NÂNG CAO)"}, {"id": 65, "q": "Trong bài Bảo vệ chủ quyền lãnh thổ và biên giới quốc gia (Bài 1 - SGK GDQPAN 11), Đường biên giới quốc gia trên biển của Việt Nam được xác định là đường nào?", "options": {"A": "Đường ranh giới ngoài của vùng nội thủy", "B": "Đường ranh giới ngoài của lãnh hải 12 hải lý tính từ đường cơ sở", "C": "Đường ranh giới ngoài của vùng đặc quyền kinh tế 200 hải lý", "D": "Đường ranh giới ngoài của thềm lục địa"}, "answer": "B", "source": "SGK GDQPAN 11, Bài 1 - Lãnh hải và Biên giới quốc gia trên biển", "section": "PHẦN III: KỸ THUẬT - CHIẾN THUẬT QUÂN SỰ VÀ SGK GDQPAN 10-11-12 (25 CÂU NÂNG CAO)"}, {"id": 66, "q": "Trong bài 4 - SGK GDQPAN 12, âm mưu cốt lõi của chiến lược 'Diễn biến hòa bình' do các thế lực thù địch tiến hành đối với Việt Nam là gì?", "options": {"A": "Sử dụng hỏa lực quân sự công nghệ cao tấn công xâm lược trực tiếp", "B": "Dùng mọi thủ đoạn phi quân sự làm suy yếu từ bên trong, chuyển hóa chế độ chính trị XHCN ở Việt Nam sang quỹ đạo tư bản chủ nghĩa", "C": "Cấm vận kinh tế triệt để dừng mọi hoạt động thương mại", "D": "Phong tỏa toàn bộ hệ thống giao thông đường biển"}, "answer": "B", "source": "SGK GDQPAN 12, Bài 4 - Bản chất Chiến lược Diễn biến hòa bình", "section": "PHẦN IV: QUỐC PHÒNG, 'DIỄN BIẾN HÒA BÌNH', AN NINH MẠNG VÀ BẢO VỆ CHỦ QUYỀN (20 CÂU NÂNG CAO)"}, {"id": 67, "q": "Thủ đoạn 'Phi chính trị hóa Quân đội và Công an' của các thế lực thù địch nhằm mục đích nguy hiểm nào sau đây?", "options": {"A": "Giảm chi phí ngân sách quốc phòng nhà nước", "B": "Tách lực lượng vũ trang khỏi sự lãnh đạo tuyệt đối, trực tiếp về mọi mặt của Đảng Cộng sản Việt Nam", "C": "Đưa trang bị vũ khí phương Tây vào Quân đội", "D": "Cho phép quân nhân tham gia kinh doanh tự do"}, "answer": "B", "source": "SGK GDQPAN 12, Bài 4 - Thủ đoạn Phi chính trị hóa lực lượng vũ trang", "section": "PHẦN IV: QUỐC PHÒNG, 'DIỄN BIẾN HÒA BÌNH', AN NINH MẠNG VÀ BẢO VỆ CHỦ QUYỀN (20 CÂU NÂNG CAO)"}, {"id": 68, "q": "Bạo loạn lật đổ (Bài 4 - SGK GDQPAN 12) là hành động chống phá bằng bạo lực có tổ chức do lực lượng nào tiến hành?", "options": {"A": "Do quân đội nước ngoài đánh chiếm biên giới", "B": "Do lực lượng phản động trong nước hoặc cấu kết với nước ngoài tiến hành nhằm lật đổ chính quyền nhân dân tại địa phương hoặc Trung ương", "C": "Do tội phạm hình sự trộm cắp tài sản công cộng", "D": "Do người dân tự phát khiếu kiện đất đai"}, "answer": "B", "source": "SGK GDQPAN 12, Bài 4 - Khái niệm Bạo loạn lật đổ", "section": "PHẦN IV: QUỐC PHÒNG, 'DIỄN BIẾN HÒA BÌNH', AN NINH MẠNG VÀ BẢO VỆ CHỦ QUYỀN (20 CÂU NÂNG CAO)"}, {"id": 69, "q": "Theo Luật An ninh mạng 2018 và SGK GDQPAN 10 (Bài 6), hành vi nào sau đây trên không gian mạng bị pháp luật nghiêm cấm tuyệt đối?", "options": {"A": "Viết bài chia sẻ kinh nghiệm học tập môn GDQPAN", "B": "Đăng tải, phát tán thông tin bịa đặt, sai sự thật gây hoang mang trong nhân dân, xúc phạm danh dự nhân phẩm cá nhân, tổ chức", "C": "Mua sắm hàng hóa trực tuyến trên các sàn thương mại điện tử hợp pháp", "D": "Sử dụng mật khẩu phức tạp có ký tự đặc biệt"}, "answer": "B", "source": "SGK GDQPAN 10, Bài 6 - Các hành vi cấm trên không gian mạng", "section": "PHẦN IV: QUỐC PHÒNG, 'DIỄN BIẾN HÒA BÌNH', AN NINH MẠNG VÀ BẢO VỆ CHỦ QUYỀN (20 CÂU NÂNG CAO)"}, {"id": 70, "q": "Khái niệm 'Không gian mạng quốc gia' được định nghĩa như thế nào trong Luật An ninh mạng và SGK GDQPAN 10?", "options": {"A": "Toàn bộ mạng internet toàn cầu kết nối máy tính", "B": "Không gian mạng do Chính phủ xác lập, quản lý và kiểm soát thuộc phạm vi chủ quyền quốc gia Việt Nam", "C": "Các trang mạng xã hội có lượt truy cập lớn tại Việt Nam", "D": "Hệ thống cáp quang biển quốc tế đi qua lãnh hải"}, "answer": "B", "source": "SGK GDQPAN 10, Bài 6 - Định nghĩa Không gian mạng quốc gia", "section": "PHẦN IV: QUỐC PHÒNG, 'DIỄN BIẾN HÒA BÌNH', AN NINH MẠNG VÀ BẢO VỆ CHỦ QUYỀN (20 CÂU NÂNG CAO)"}, {"id": 71, "q": "Nghệ thuật quân sự Việt Nam (Bài 5 - SGK GDQPAN 12) bao gồm 3 bộ phận hợp thành cốt lõi nào?", "options": {"A": "Kỹ thuật chiến đấu, Thao trường tập luyện, Vũ khí khí tài", "B": "Chiến lược quân sự, Nghệ thuật chiến dịch và Chiến thuật", "C": "Công binh, Pháo binh, Tăng thiết giáp", "D": "Tiến công, Phòng ngự, Rút lui"}, "answer": "B", "source": "SGK GDQPAN 12, Bài 5 - Cấu trúc Nghệ thuật quân sự Việt Nam", "section": "PHẦN IV: QUỐC PHÒNG, 'DIỄN BIẾN HÒA BÌNH', AN NINH MẠNG VÀ BẢO VỆ CHỦ QUYỀN (20 CÂU NÂNG CAO)"}, {"id": 72, "q": "Tư tưởng chỉ đạo tác chiến xuyên suốt trong Lịch sử nghệ thuật đánh giặc của dân tộc ta (Bài 5 - SGK 12) là gì?", "options": {"A": "Chờ địch đánh trước rồi mới phản công", "B": "Nắm vững tư tưởng tiến công, chủ động tiến công liên tục", "C": "Cố thủ trong thành trì kiên cố", "D": "Chỉ đánh khi có vũ khí hiện đại hơn địch"}, "answer": "B", "source": "SGK GDQPAN 12, Bài 5 - Tư tưởng chỉ đạo tiến công", "section": "PHẦN IV: QUỐC PHÒNG, 'DIỄN BIẾN HÒA BÌNH', AN NINH MẠNG VÀ BẢO VỆ CHỦ QUYỀN (20 CÂU NÂNG CAO)"}, {"id": 73, "q": "Truyền thống 'Dựng nước đi đôi với giữ nước' (Bài 1 - SGK GDQPAN 10) phản ánh quy luật lịch sử nào của dân tộc Việt Nam?", "options": {"A": "Quy luật phát triển kinh tế biển đảo", "B": "Quy luật tồn tại và phát triển của dân tộc Việt Nam trong suốt hàng ngàn năm lịch sử", "C": "Quy luật hòa hoãn giao hảo ngoại giao", "D": "Quy luật mở rộng lãnh thổ ra bên ngoài"}, "answer": "B", "source": "SGK GDQPAN 10, Bài 1 - Truyền thống đánh giặc giữ nước", "section": "PHẦN IV: QUỐC PHÒNG, 'DIỄN BIẾN HÒA BÌNH', AN NINH MẠNG VÀ BẢO VỆ CHỦ QUYỀN (20 CÂU NÂNG CAO)"}, {"id": 74, "q": "Theo Luật Biên giới quốc gia và Bài 1 - SGK GDQPAN 11, Vùng biển nào thuộc chủ quyền hoàn toàn và tuyệt đối của Việt Nam như trên đất liền?", "options": {"A": "Vùng Tiếp giáp hải lý", "B": "Vùng Nội thủy", "C": "Vùng Đặc quyền kinh tế", "D": "Vùng Thềm lục địa"}, "answer": "B", "source": "SGK GDQPAN 11, Bài 1 - Chế độ pháp lý Vùng Nội thủy", "section": "PHẦN IV: QUỐC PHÒNG, 'DIỄN BIẾN HÒA BÌNH', AN NINH MẠNG VÀ BẢO VỆ CHỦ QUYỀN (20 CÂU NÂNG CAO)"}, {"id": 75, "q": "Trang bị phương tiện công nghệ cao (Deepfake, AI) bị các đối tượng phản động lợi dụng hiện nay nhằm mục đích gì nguy hiểm nhất?", "options": {"A": "Tạo video quảng cáo sản phẩm giá rẻ", "B": "Cắt ghép hình ảnh, làm giả giọng nói các đồng chí lãnh đạo Đảng, Nhà nước để phát tán tin giả, bôi nhọ uy tín và lừa đảo chính trị", "C": "Hỗ trợ học sinh giải bài tập học tập trực tuyến", "D": "Tự động trả lời tin nhắn rác bán hàng"}, "answer": "B", "source": "SGK GDQPAN 10, Bài 6 & Chuyên đề An ninh mạng hiện đại", "section": "PHẦN IV: QUỐC PHÒNG, 'DIỄN BIẾN HÒA BÌNH', AN NINH MẠNG VÀ BẢO VỆ CHỦ QUYỀN (20 CÂU NÂNG CAO)"}, {"id": 76, "q": "Bài học kinh nghiệm quân sự 'Lấy nhỏ thắng lớn, lấy ít địch nhiều' (Bài 5 - SGK 12) xuất phát từ cơ sở thực tiễn nào?", "options": {"A": "Dân số nước ta luôn đông hơn kẻ thù xâm lược", "B": "Nước ta đất không rộng, người không đông, thường xuyên phải chống lại các đế quốc xâm lược có tiềm lực quân sự kinh tế lớn hơn nhiều lần", "C": "Nhờ mua vũ khí hiện đại từ bên ngoài", "D": "Kẻ thù luôn chủ động rút quân trước"}, "answer": "B", "source": "SGK GDQPAN 12, Bài 5 - Nghệ thuật lấy ít địch nhiều", "section": "PHẦN IV: QUỐC PHÒNG, 'DIỄN BIẾN HÒA BÌNH', AN NINH MẠNG VÀ BẢO VỆ CHỦ QUYỀN (20 CÂU NÂNG CAO)"}, {"id": 77, "q": "Theo SGK GDQPAN 12 (Bài 2), Quân đội nhân dân Việt Nam được tổ chức thành các Quân binh chủng chính nào?", "options": {"A": "Lục quân, Hải quân, Phòng không - Không quân", "B": "Bộ binh, Pháo binh, Thiết giáp", "C": "Quân khu, Quân đoàn, Bộ Chỉ huy quân sự", "D": "Cảnh sát biển, Biên phòng, Dân quân tự vệ"}, "answer": "A", "source": "SGK GDQPAN 12, Bài 2 - Cơ cấu Quân binh chủng QĐNDVN", "section": "PHẦN IV: QUỐC PHÒNG, 'DIỄN BIẾN HÒA BÌNH', AN NINH MẠNG VÀ BẢO VỆ CHỦ QUYỀN (20 CÂU NÂNG CAO)"}, {"id": 78, "q": "Mục tiêu chiến lược bảo vệ Tổ quốc Việt Nam XHCN trong tình hình mới được xác định cốt lõi trong Bài 1 - SGK GDQPAN 12 là gì?", "options": {"A": "Bảo vệ vững chắc độc lập, chủ quyền, thống nhất, toàn vẹn lãnh thổ; bảo vệ Đảng, Nhà nước, Nhân dân và chế độ XHCN", "B": "Đóng cửa toàn bộ biên giới không giao thương", "C": "Tăng cường quân số lực lượng thường trực lên 5 triệu quân", "D": "Chỉ tập trung phát triển kinh tế không chi cho quốc phòng"}, "answer": "A", "source": "SGK GDQPAN 12, Bài 1 - Mục tiêu Bảo vệ Tổ quốc", "section": "PHẦN IV: QUỐC PHÒNG, 'DIỄN BIẾN HÒA BÌNH', AN NINH MẠNG VÀ BẢO VỆ CHỦ QUYỀN (20 CÂU NÂNG CAO)"}, {"id": 79, "q": "Trong bài 4 - SGK GDQPAN 10 (Phòng chống vi phạm trật tự ATGT), người điều khiển xe gắn máy dưới 50cm3 bắt buộc phải từ đủ bao nhiêu tuổi?", "options": {"A": "Từ đủ 14 tuổi", "B": "Từ đủ 16 tuổi", "C": "Từ đủ 18 tuổi", "D": "Từ đủ 20 tuổi"}, "answer": "B", "source": "SGK GDQPAN 10, Bài 4 - Độ tuổi điều khiển xe gắn máy", "section": "PHẦN IV: QUỐC PHÒNG, 'DIỄN BIẾN HÒA BÌNH', AN NINH MẠNG VÀ BẢO VỆ CHỦ QUYỀN (20 CÂU NÂNG CAO)"}, {"id": 80, "q": "Theo Luật Quản lý, sử dụng vũ khí, vật liệu nổ và công cụ hỗ trợ (Bài 7 - SGK GDQPAN 11), hành vi nào sau đây bị cấm nghiêm ngặt đối với học sinh?", "options": {"A": "Sử dụng mô hình súng AK phi kim loại trong giờ học thực hành theo lệnh giáo viên", "B": "Chế tạo, tàng trữ, vận chuyển, mua bán hoặc sử dụng trái phép pháo nổ, vũ khí thô sơ, dao găm, kiếm, súng tự chế", "C": "Xem tranh ảnh giới thiệu về các loại vũ khí quân dụng", "D": "Đeo bao xe tập ngắm bắn trên thao trường"}, "answer": "B", "source": "SGK GDQPAN 11, Bài 7 - Hành vi cấm về vũ khí vật liệu nổ", "section": "PHẦN IV: QUỐC PHÒNG, 'DIỄN BIẾN HÒA BÌNH', AN NINH MẠNG VÀ BẢO VỆ CHỦ QUYỀN (20 CÂU NÂNG CAO)"}, {"id": 81, "q": "Chủ trương xây dựng thế trận quốc phòng toàn dân gắn với thế trận an ninh nhân dân (Bài 1 - SGK 12) mang ý nghĩa chiến lược nào?", "options": {"A": "Tạo ra sức mạnh tổng hợp của toàn dân tộc, kết hợp chặt chẽ giữa quốc phòng với an ninh và kinh tế xã hội", "B": "Chuyển toàn bộ nhà máy sang sản xuất vũ khí", "C": "Cho phép người dân tự do mua vũ khí cá nhân", "D": "Giải tán lực lượng công an địa phương"}, "answer": "A", "source": "SGK GDQPAN 12, Bài 1 - Thế trận Quốc phòng toàn dân", "section": "PHẦN IV: QUỐC PHÒNG, 'DIỄN BIẾN HÒA BÌNH', AN NINH MẠNG VÀ BẢO VỆ CHỦ QUYỀN (20 CÂU NÂNG CAO)"}, {"id": 82, "q": "Trong nghệ thuật đánh giặc của Nguyễn Trãi và Lê Lợi (Khởi nghĩa Lam Sơn - Bài 5 SGK 12), tư tưởng nhân đạo quân sự thể hiện rõ nhất qua câu thơ nào trong Bình Ngô đại cáo?", "options": {"A": "'Đánh một trận sạch không kình ngạc / Đánh hai trận tan tác chim muông'", "B": "'Lấy đại nghĩa để thắng hung tàn / Đem chí nhân để thay cường bạo'", "C": "'Gươm mài đá đá núi phải mòn / Voi uống nước nước sông phải cạn'", "D": "'Ninh Kiều máu chảy thành sông / Tụy Động thây chất đầy nội'"}, "answer": "B", "source": "SGK GDQPAN 12, Bài 5 - Tư tưởng Chí nhân Đại nghĩa", "section": "PHẦN IV: QUỐC PHÒNG, 'DIỄN BIẾN HÒA BÌNH', AN NINH MẠNG VÀ BẢO VỆ CHỦ QUYỀN (20 CÂU NÂNG CAO)"}, {"id": 83, "q": "Theo Luật Giáo dục quốc phòng và an ninh, lực lượng nòng cốt của quốc phòng toàn dân bao gồm những lực lượng nào?", "options": {"A": "Quân đội nhân dân và Công an nhân dân", "B": "Quân đội nhân dân, Công an nhân dân và Dân quân tự vệ", "C": "Lực lượng dự bị động viên và Học sinh sinh viên", "D": "Toàn bộ cán bộ công chức các bộ ngành"}, "answer": "B", "source": "Luật GDQPAN 2013, Điều 4", "section": "PHẦN IV: QUỐC PHÒNG, 'DIỄN BIẾN HÒA BÌNH', AN NINH MẠNG VÀ BẢO VỆ CHỦ QUYỀN (20 CÂU NÂNG CAO)"}, {"id": 84, "q": "Yếu tố nào đóng vai trò QUYẾT ĐỊNH THẮNG LỢI trong chiến tranh bảo vệ Tổ quốc theo quan điểm Mác - Lênin và Tư tưởng Hồ Chí Minh?", "options": {"A": "Vũ khí công nghệ cao hiện đại", "B": "Con người, mà trước hết là bản lĩnh chính trị, ý chí tinh thần và mục đích chiến đấu vì độc lập tự do", "C": "Tiềm lực kinh tế tài chính dồi dào", "D": "Địa hình núi cao vực sâu"}, "answer": "B", "source": "SGK GDQPAN 12, Bài 1, 5 - Yếu tố con người quyết định", "section": "PHẦN IV: QUỐC PHÒNG, 'DIỄN BIẾN HÒA BÌNH', AN NINH MẠNG VÀ BẢO VỆ CHỦ QUYỀN (20 CÂU NÂNG CAO)"}, {"id": 85, "q": "Hiện tượng 'Tự diễn biến', 'Tự chuyển hóa' trong nội bộ (Bài 4 - SGK 12) là gì?", "options": {"A": "Sự suy thoái về tư tưởng chính trị, đạo đức, lối sống dẫn đến làm thay đổi bản chất từ bên trong cán bộ, đảng viên", "B": "Việc chuyển đổi công tác từ đơn vị này sang đơn vị khác", "C": "Việc ứng dụng công nghệ thông tin vào quản lý hành chính", "D": "Sự thay đổi thời tiết thất thường trên địa bàn"}, "answer": "A", "source": "SGK GDQPAN 12, Bài 4 - Khái niệm Tự diễn biến tự chuyển hóa", "section": "PHẦN IV: QUỐC PHÒNG, 'DIỄN BIẾN HÒA BÌNH', AN NINH MẠNG VÀ BẢO VỆ CHỦ QUYỀN (20 CÂU NÂNG CAO)"}, {"id": 86, "q": "Theo Luật Giáo dục sửa đổi 2025 (Luật số 123/2025/QH15), từ ngày 01/01/2026, quy định nào sau đây đối với bằng tốt nghiệp THCS là chính xác?", "options": {"A": "Tiếp tục cấp bằng tốt nghiệp THCS bằng giấy như trước đây", "B": "Bãi bỏ bằng tốt nghiệp THCS; Hiệu trưởng xác nhận hoàn thành chương trình THCS trong học bạ", "C": "Bằng tốt nghiệp THCS do Giám đốc Sở GD&ĐT cấp dưới dạng file số", "D": "Bằng tốt nghiệp THCS chuyển thành Chứng chỉ học trình"}, "answer": "B", "source": "Luật Giáo dục sửa đổi 2025, Điều 1; Tóm tắt điểm nổi bật của LUẬT..docx", "section": "PHẦN V: PHÁP LUẬT GIÁO DỤC, LUẬT NHÀ GIÁO, NGHỊ QUYẾT VÀ ĐIỀU LỆ HỘI THI GVG 2026 (15 CÂU NÂNG CAO)"}, {"id": 87, "q": "Theo Luật Giáo dục sửa đổi 2025, văn bằng, chứng chỉ trong hệ thống giáo dục quốc dân thể hiện dưới dạng nào có giá trị pháp lý như nhau?", "options": {"A": "Chỉ công nhận duy nhất dạng văn bằng in trên phôi giấy bảo mật", "B": "Thể hiện dưới dạng giấy hoặc dạng số và có giá trị pháp lý hoàn toàn như nhau", "C": "Dạng số chỉ dùng để tham khảo, dạng giấy mới có giá trị pháp lý", "D": "Phải nộp lệ phí quy đổi từ dạng giấy sang dạng số"}, "answer": "B", "source": "Luật Giáo dục sửa đổi 2025, Điều 1", "section": "PHẦN V: PHÁP LUẬT GIÁO DỤC, LUẬT NHÀ GIÁO, NGHỊ QUYẾT VÀ ĐIỀU LỆ HỘI THI GVG 2026 (15 CÂU NÂNG CAO)"}, {"id": 88, "q": "Chính sách miễn phí sách giáo khoa cho học sinh phổ thông theo Luật Giáo dục sửa đổi 2025 bắt đầu chính thức thực hiện từ mốc thời gian nào?", "options": {"A": "Từ ngày 01/01/2025", "B": "Từ ngày 01/01/2026", "C": "Từ ngày 01/07/2026", "D": "Từ năm học 2027-2028"}, "answer": "C", "source": "Luật Giáo dục sửa đổi 2025, Điều 2", "section": "PHẦN V: PHÁP LUẬT GIÁO DỤC, LUẬT NHÀ GIÁO, NGHỊ QUYẾT VÀ ĐIỀU LỆ HỘI THI GVG 2026 (15 CÂU NÂNG CAO)"}, {"id": 89, "q": "Theo Luật Giáo dục sửa đổi 2025, quy định nào sau đây áp dụng đối với Hội đồng trường mầm non và phổ thông công lập từ ngày 01/01/2026?", "options": {"A": "Tiếp tục tăng thêm quyền hạn quyết định nhân sự cho Hội đồng trường", "B": "Hội đồng trường mầm non và phổ thông công lập kết thúc hoạt động, bàn giao toàn bộ hồ sơ cho Hiệu trưởng quản lý", "C": "Chuyển Hội đồng trường thành Hội đồng quản trị doanh nghiệp giáo dục", "D": "Thay đổi Chủ tịch Hội đồng trường phải là đại biểu HĐND cấp huyện"}, "answer": "B", "source": "Luật Giáo dục sửa đổi 2025, Điều 1", "section": "PHẦN V: PHÁP LUẬT GIÁO DỤC, LUẬT NHÀ GIÁO, NGHỊ QUYẾT VÀ ĐIỀU LỆ HỘI THI GVG 2026 (15 CÂU NÂNG CAO)"}, {"id": 90, "q": "Theo Luật Nhà giáo 2025 (Luật số 73/2025/ const storeKey='gdqpan100_v1';let saved={};try{saved=JSON.parse(localStorage.getItem(storeKey)||'{}')}catch(e){};
saved.history ||= [];saved.wrong ||= [];saved.seen ||= [];let session=null,timer=null;
const app=document.getElementById('app');const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const persist=()=>{try{localStorage.setItem(storeKey,JSON.stringify(saved))}catch(e){}};
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
const shortSection=s=>s.replace(/ \(\d+ CÂU NÂNG CAO\)$/,'');
function home(){clearInterval(timer);session=null;let last=saved.history.slice(-5).reverse();app.innerHTML=`<section class="panel"><h2>Chọn hình thức ôn tập</h2><div class="stat"><div><b>${saved.seen.length}</b><small>Đã làm</small></div><div><b>${saved.wrong.length}</b><small>Cần ôn lại</small></div><div><b>${saved.history.length}</b><small>Lượt hoàn thành</small></div></div><p class="muted">Chọn chế độ bên dưới để bắt đầu.</p><div class="actions"><button class="primary" onclick="start('practice')">Ôn toàn bộ 100 câu</button><button class="primary" onclick="start('exam')">Thi thử 40 câu / 50 phút</button><button class="secondary" onclick="start('wrong')">Ôn lại câu sai (${saved.wrong.length})</button></div></section><section class="panel"><h2>Ôn theo từng phần</h2><select id="topic">${[...new Set(DATA.map(x=>x.section))].map((s,i)=>`<option value="${i}">${esc(shortSection(s))}</option>`).join('')}</select><button class="primary" onclick="start('topic')">Bắt đầu phần đã chọn</button></section><section class="panel"><h2>Kết quả gần đây</h2>${last.length?last.map(h=>`<p><b>${esc(h.mode)}</b> · ${h.score}/${h.total} câu đúng · ${esc(h.date)}</p>`).join(''):'<p class="muted">Chưa có bài hoàn thành.</p>'}<button class="secondary" onclick="if(confirm('Xóa toàn bộ lịch sử và câu sai trên thiết bị này?')){saved={history:[],wrong:[],seen:[]};persist();home()}" >Xóa dữ liệu ôn tập</button></section>`}
function start(mode){let pool=DATA;if(mode==='topic'){let sec=[...new Set(DATA.map(x=>x.section))][Number(document.getElementById('topic').value)];pool=DATA.filter(x=>x.section===sec)}if(mode==='wrong')pool=DATA.filter(x=>saved.wrong.includes(x.id));if(!pool.length){alert('Chưa có câu sai để ôn lại.');return}if(mode==='exam')pool=shuffle(pool).slice(0,40);session={mode,questions:pool,index:0,answers:{},started:Date.now(),done:false};if(mode==='exam'){timer=setInterval(()=>{if(session?.mode==='exam'&&!session.done){if(Date.now()-session.started>=3000000){finish();return}let e=document.getElementById('clock');if(e)e.textContent=timeLeft()}},1000)}render()}
function timeLeft(){let n=Math.max(0,3000-Math.floor((Date.now()-session.started)/1000));return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}
function render(){let s=session;if(!s)return home();let q=s.questions[s.index],v=s.answers[q.id],revealed=v!==undefined&&s.mode!=='exam';app.innerHTML=`<section class="panel"><div class="top"><span class="pill">${s.mode==='exam'?'Thi thử':s.mode==='topic'?'Ôn theo phần':s.mode==='wrong'?'Ôn câu sai':'Ôn toàn bộ'}</span>${s.mode==='exam'?`<span class="timer" id="clock">${timeLeft()}</span>`:''}</div><div class="top"><b>Câu ${s.index+1} / ${s.questions.length}</b><span class="muted">Câu gốc ${q.id}</span></div><div class="bar"><div style="width:${(s.index+1)/s.questions.length*100}%"></div></div><div class="muted">${esc(shortSection(q.section))}</div><p class="question">${esc(q.q)}</p>${Object.entries(q.options).map(([k,val])=>`<button class="choice ${v===k?'selected':''} ${revealed&&k===q.answer?'correct':''} ${revealed&&v===k&&v!==q.answer?'wrong':''}" onclick="choose('${k}')" ${revealed?'disabled':''}><b>${k}.</b> ${esc(val)}</button>`).join('')}${revealed?`<div class="feedback"><b>${v===q.answer?'✓ Chính xác!':'✗ Chưa đúng.'}</b><div>Đáp án theo tài liệu: <b>${q.answer}. ${esc(q.options[q.answer])}</b></div><div class="notice">Nguồn ghi trong tài liệu: ${esc(q.source||'Không có')}</div></div>`:''}<div class="actions" style="margin-top:18px"><button class="secondary" onclick="move(-1)" ${s.index===0?'disabled':''}>← Câu trước</button><button class="primary" onclick="${s.index===s.questions.length-1?'finish()':'move(1)'}">${s.index===s.questions.length-1?'Nộp bài':'Câu tiếp →'}</button><button class="danger" onclick="if(confirm('Kết thúc lượt làm này?'))finish()">Kết thúc</button></div>${s.mode==='exam'?'<p class="notice">Thi thử: đáp án chỉ hiện sau khi nộp bài. Câu chưa chọn tính là sai.</p>':'<p class="notice">Ôn luyện: chọn đáp án để xem kết quả và nguồn trích dẫn ngay.</p>'}</section>`}
function choose(k){let s=session,q=s.questions[s.index];if(s.mode!=='exam'&&s.answers[q.id]!==undefined)return;s.answers[q.id]=k;if(!saved.seen.includes(q.id))saved.seen.push(q.id);if(s.mode!=='exam'){if(k!==q.answer){if(!saved.wrong.includes(q.id))saved.wrong.push(q.id)}else saved.wrong=saved.wrong.filter(x=>x!==q.id)}persist();render()}
function move(n){session.index=Math.max(0,Math.min(session.questions.length-1,session.index+n));render()}
function finish(){let s=session;if(!s||s.done)return;s.done=true;clearInterval(timer);let correct=s.questions.filter(q=>s.answers[q.id]===q.answer).length;for(let q of s.questions){if(s.answers[q.id]!==undefined){if(!saved.seen.includes(q.id))saved.seen.push(q.id);if(s.answers[q.id]!==q.answer){if(!saved.wrong.includes(q.id))saved.wrong.push(q.id)}else saved.wrong=saved.wrong.filter(x=>x!==q.id)}}saved.history.push({mode:({exam:'Thi thử',practice:'Ôn toàn bộ',topic:'Ôn theo phần',wrong:'Ôn câu sai'})[s.mode],score:correct,total:s.questions.length,date:new Date().toLocaleString('vi-VN')});persist();let incorrect=s.questions.filter(q=>s.answers[q.id]!==q.answer);app.innerHTML=`<section class="panel"><h2>Hoàn thành lượt ôn tập</h2><div class="stat"><div><b>${correct}/${s.questions.length}</b><small>Đúng</small></div><div><b>${Math.round(correct/s.questions.length*100)}%</b><small>Tỷ lệ</small></div><div><b>${incorrect.length}</b><small>Sai / bỏ trống</small></div></div><div class="actions" style="margin-top:18px"><button class="primary" onclick="home()">Về trang chủ</button><button class="secondary" onclick="review()">Xem đáp án từng câu</button></div></section>`}
function review(){let s=session;app.innerHTML=`<div class="actions"><button class="primary" onclick="home()">← Trang chủ</button></div>${s.questions.map(q=>`<section class="panel"><div class="muted">Câu ${q.id} · ${s.answers[q.id]===q.answer?'✓ Đúng':'✗ Sai hoặc bỏ trống'}</div><p class="question">${esc(q.q)}</p>${Object.entries(q.options).map(([k,v])=>`<p style="${k===q.answer?'color:#14744b;font-weight:700':k===s.answers[q.id]?'color:#b33e38':''}">${k}. ${esc(v)} ${k===q.answer?'✓':''}</p>`).join('')}<div class="notice">Anh chọn: ${s.answers[q.id]||'Chưa chọn'} · Nguồn: ${esc(q.source)}</div></section>`).join('')}<button class="primary" onclick="home()">Về trang chủ</button>`}
home();
</script></body></html>
